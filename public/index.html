<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:wght@700;900&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:wght@700;900&display=swap"
      />
    </noscript>

    <script>
      (function() {
        const API_URL = 'https://empatia-dominio-back.vercel.app/api/posts'; 

        fetch(API_URL)
          .then(res => res.json())
          .then(posts => {
            // Guardamos todos los posts en el objeto global
            window.__INITIAL_POSTS__ = posts;

            if (posts && posts.length > 0) {
              // Replicamos el ordenamiento por votos/likes del front para hallar el Top 1
              const topPosts = [...posts].sort((a, b) => (b.votos || b.likes || 0) - (a.votos || a.likes || 0));
              const firstPost = topPosts[0];
              
              let imageUrl = firstPost ? (firstPost.portada || firstPost.imagen || firstPost.img) : null;

              if (imageUrl && typeof imageUrl === 'string') {
                // Optimización para celulares (w_450 en Cloudinary)
                if (window.innerWidth <= 768) {
                  imageUrl = imageUrl.replace('/w_800/', '/w_450/');
                }

                // Inyectamos la precarga de la imagen real del elemento LCP
                const link = document.createElement('link');
                link.rel = 'preload';
                link.as = 'image';
                link.href = imageUrl;
                link.fetchPriority = 'high';
                document.head.appendChild(link);
              }
            }
          })
          .catch(err => console.error("Early fetch LCP error:", err));
      })();
    </script>

    <link rel="icon" type="image/png" href="empatialog.jpeg" />
    <link rel="apple-touch-icon" href="https://www.empatiadigital.com.ar/empatialog.jpeg" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="canonical" href="https://empatiadigital.com.ar" />

    <title>Empatía Digital | Salud Digital, Prevención de Grooming y Crianza</title>

    <meta
      name="description"
      content="Recursos y herramientas sobre salud digital, prevención de grooming, ciberseguridad y uso consciente de tecnologías. Talleres para familias, escuelas y comunidades."
    />

    <meta property="og:title" content="Empatía Digital – Salud Digital y Prevención de Grooming" />
    <meta
      property="og:description"
      content="Promovemos el bienestar digital y la ciberseguridad. Encontrá herramientas y talleres sobre crianza digital, uso de pantallas y prevención de riesgos en línea."
    />
    <meta property="og:image" content="https://www.empatiadigital.com.ar/empatialog.jpeg" />
    <meta property="og:url" content="https://empatiadigital.com.ar" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Empatía Digital – Convivencia y Salud Digital Consciente" />
    <meta
      name="twitter:description"
      content="Propuestas de ciudadanía digital, prevención de grooming y bienestar tecnológico para docentes, familias y entornos educativos."
    />
    <meta name="twitter:image" content="https://www.empatiadigital.com.ar/empatialog.jpeg" />
  </head>

  <body>
    <noscript>Necesitas habilitar JavaScript para ejecutar esta aplicación.</noscript>
