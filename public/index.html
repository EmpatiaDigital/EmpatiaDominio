    <script>
      (function() {
        // Pedimos únicamente la página 1 con el límite real del front
        const API_URL = 'https://empatia-dominio-back.vercel.app/api/posts?page=1&limit=6'; 

        fetch(API_URL)
          .then(res => res.json())
          .then(data => {
            // Accedemos de forma segura al array 'posts' de tu nueva estructura
            const posts = data.posts;
            
            if (posts && posts.length > 0) {
              // El primer post de la lista suele ser el LCP en la visualización inicial
              const firstPost = posts[0];
              let imageUrl = firstPost ? (firstPost.portada || firstPost.imagen || firstPost.img) : null;

              if (imageUrl && typeof imageUrl === 'string') {
                // Optimización de tamaño para mobile si es Cloudinary
                if (window.innerWidth <= 768) {
                  imageUrl = imageUrl.replace('/w_800/', '/w_450/');
                }

                // Inyectamos el link de precarga en el HEAD inmediatamente
                const link = document.createElement('link');
                link.rel = 'preload';
                link.as = 'image';
                link.href = imageUrl;
                link.fetchPriority = 'high'; // Le dice al navegador: "bajala ya mismo"
                document.head.appendChild(link);
              }
            }
          })
          .catch(err => console.error("Early LCP patch error:", err));
      })();
    </script>
